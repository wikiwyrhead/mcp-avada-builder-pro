name: PHP Lint

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Lint PHP files
        run: |
          set -e
          find . -name "*.php" -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
